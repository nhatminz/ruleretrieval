[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rule-retrieval"
version = "0.1.0"
description = "Standalone Vietnamese legal rule retrieval benchmark with private court-applied silver references"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "pyarrow>=18,<24", "huggingface-hub>=0.28,<1", "httpx>=0.28,<1",
  "typer>=0.15,<1", "fastapi>=0.115,<1", "uvicorn>=0.33,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
model = ["torch>=2.5,<2.6", "transformers>=4.48,<4.52", "accelerate>=1,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
rule-retrieval = "rule_retrieval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
